<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Início | Nosso Sangue</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body>
  <header id="navbar"></header>
  <main class="conteudo inicio">
    <div>
      <h2 class="titulo-secao">Estoque em tempo real</h2>
      <section class="painel-cinza" aria-label="Estoque por tipo sanguíneo">
        <div class="grafico" id="grafico"></div>
        <div class="grafico__rotulos" id="rotulos"></div>
      </section>
      <h2 class="titulo-secao" style="margin-top:28px">Monitoramento câmara fria</h2>
      <section class="painel-cinza camara" aria-live="polite">
        <div class="camara__item">Temperatura<div class="camara__valor" id="temp">--</div></div>
        <div class="camara__item">Refrigeração<div class="camara__valor camara__valor--off" id="refrig">--</div></div>
        <div class="camara__item">Umidade<div class="camara__valor" id="umid">--</div></div>
      </section>
    </div>
    <aside class="alerta">
      <button class="btn" id="btn-alerta" aria-expanded="false" aria-controls="painel-alerta">Enviar alerta para doadores</button>
      <div class="alerta__painel" id="painel-alerta" hidden>
        <p>Selecione o tipo sanguíneo dos doadores para enviar o alerta.</p>
        <button class="alerta__tipos" id="btn-tipos" aria-expanded="false" type="button"><span>Tipos</span><span>▼</span></button>
        <div class="alerta__lista" id="lista-tipos"></div>
        <button class="btn" id="enviar-alerta" type="button">Enviar alerta</button>
      </div>
    </aside>
  </main>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/inicio.js"></script>
</body>
</html>
