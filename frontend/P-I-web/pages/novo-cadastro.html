<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Novo cadastro | Nosso Sangue</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header id="navbar"></header>
  <main class="conteudo">
    <form class="painel-rosa cadastro" id="form-cadastro" novalidate>
      <div class="cadastro__grid">
        <div class="campo"><label for="nome">Nome completo</label><input id="nome" required></div>
        <div class="campo"><label for="email">Email</label><input id="email" type="email" autocomplete="off" required></div>
        <div class="campo"><label for="cpf">CPF</label><input id="cpf" inputmode="numeric" placeholder="000.000.000-00" required></div>
        <div class="campo"><label for="nasc">Data de nascimento</label><input id="nasc" type="date" required></div>
        <div class="campo"><label for="sexo">Sexo</label>
          <select id="sexo" required><option value="">Selecione</option><option value="M">Masculino</option><option value="F">Feminino</option><option value="O">Outro</option></select></div>
        <div class="campo"><label for="tipo">Tipo sanguíneo</label>
          <select id="tipo" required><option value="">Selecione</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select></div>
        <div class="campo"><label for="tel">Telefone</label><input id="tel" inputmode="tel" placeholder="(00) 00000-0000" required></div>
        <div class="campo"><label for="peso">Peso (kg)</label><input id="peso" type="number" min="1" step="0.1" required></div>
        <div class="campo"><label for="senha">Senha</label><input id="senha" type="password" autocomplete="new-password" minlength="6" required></div>
        <div class="campo"><label for="confirma">Confirme a senha</label><input id="confirma" type="password" autocomplete="new-password" required></div>
        <button class="btn btn--verde btn--grande cadastro__salvar" type="submit">Salvar</button>
      </div>
    </form>
  </main>
  <script type="module" src="../js/novo-cadastro.js"></script>
</body>
</html>
