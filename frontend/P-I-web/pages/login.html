<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Nosso Sangue</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="login">
  <main>
    <form class="login__form" id="form-login" novalidate>
      <img src="../assets/img/logo.svg" alt="">
      <p class="login__marca">Nosso Sangue</p>
      <div class="campo"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div>
      <div class="campo"><label for="senha">Senha</label><input id="senha" type="password" autocomplete="current-password" required></div>
      <button class="btn" type="submit">Fazer login</button>
    </form>
  </main>
  <script type="module" src="../js/login.js"></script>
</body>
</html>
