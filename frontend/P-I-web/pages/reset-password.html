<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redefinir Senha | Nosso Sangue</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header id="navbar"></header>
  
  <main class="conteudo">
    <form class="painel-rosa cadastro" id="form-reset" novalidate style="max-width: 400px; display: block; margin: 60px auto 0;">
      
      <h3 style="text-align: center; margin-bottom: 20px; text-transform: uppercase;">Redefinir Senha</h3>
      <p style="text-align: center; font-size: 13px; margin-bottom: 24px;">
        Digite sua nova senha abaixo para acessar o aplicativo Nosso Sangue.
      </p>

      <div class="campo">
        <label for="nova-senha">Nova Senha</label>
        <input id="nova-senha" type="password" minlength="6" placeholder="Mínimo 6 caracteres" required>
      </div>

      <button class="btn btn--verde btn--grande" type="submit" style="width: 100%; margin-top: 14px;">
        Atualizar Senha
      </button>

    </form>
  </main>

  <script type="module" src="../js/reset-password.js"></script>
</body>
</html>
